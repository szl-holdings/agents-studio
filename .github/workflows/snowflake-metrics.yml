name: Aggregate metrics export

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: szl-snowflake-metrics-writer
  cancel-in-progress: false

jobs:
  export:
    # The enable variable schedules the admission check; it does not admit a
    # transport. An enabled run must report the hold as a nonzero failure.
    if: ${{ vars.SZL_METRICS_EXPORT_ENABLED == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Check Snowflake transport admission (currently blocked)
        run: python hosted/snowflake_operator.py
