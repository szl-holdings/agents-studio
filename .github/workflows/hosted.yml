name: Hosted Studio contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hosted-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install web dependencies only (hash-locked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/hosted-contract.txt
      - name: Verify the lock matches the Space runtime pins
        # Fails if hosted/requirements.txt pins a version the hashed lock did not install.
        run: |
          python - <<'PY'
          import re
          from importlib.metadata import PackageNotFoundError, version
          from pathlib import Path

          drift = []
          for raw in Path("hosted/requirements.txt").read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              match = re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9._-]*)==(\S+)", line)
              if match is None:
                  raise SystemExit(f"hosted/requirements.txt must use exact pins: {line!r}")
              name, pinned = match.groups()
              try:
                  installed = version(name)
              except PackageNotFoundError:
                  installed = "missing"
              if installed != pinned:
                  drift.append(f"{name}: pinned {pinned}, installed {installed}")
          if drift:
              raise SystemExit("Regenerate requirements/ci/hosted-contract.txt (command in its .in): "
                               + "; ".join(drift))
          print("hosted CI lock matches hosted/requirements.txt pins")
          PY
      - name: Auth and orchestration contracts
        working-directory: hosted
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Store SQL, isolation and quota contracts
        run: node --test hosted/tests/test_store.mjs
      - name: Browser JavaScript syntax
        run: node --check hosted/static/studio.js
      - name: Patch hygiene
        run: git diff --check
  hosted-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare synthetic packaging context
        run: |
          cp -R hosted "$RUNNER_TEMP/hosted-smoke"
          python -c 'from pathlib import Path; import json, os; Path(os.environ["RUNNER_TEMP"], "hosted-smoke", "source.json").write_text(json.dumps({"source_revision":"UNKNOWN","evidence_class":"SAMPLE"}) + "\n", encoding="utf-8")'
      - name: Build and start without provider access
        run: |
          docker build -t szl-agents-hosted-smoke "$RUNNER_TEMP/hosted-smoke"
          docker run -d --name szl-agents-hosted-smoke -e MODEL_ENABLED=0 -p 127.0.0.1:8787:7860 szl-agents-hosted-smoke
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import urlopen

          base = "http://127.0.0.1:8787"
          with urlopen(base + "/api/build-info", timeout=5) as response:
              assert json.load(response)["source"]["source_revision"] == "UNKNOWN"
          with urlopen(base + "/", timeout=5) as response:
              assert response.status == 200
          try:
              urlopen(base + "/readyz", timeout=5)
          except HTTPError as error:
              assert error.code == 503
              assert json.load(error)["ready"] == {"auth": False, "store": False, "model": False}
          else:
              raise AssertionError("disabled service must not claim readiness")
          PY
      - name: Stop smoke container
        if: always()
        run: docker rm -f szl-agents-hosted-smoke || true
